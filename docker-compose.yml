services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendora
      POSTGRES_PASSWORD: vendora
      POSTGRES_DB: vendora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
