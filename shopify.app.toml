# The production app "vendora", hosted on Render (vendora-production). Local development uses
# shopify.app.dev.toml; keep scopes, webhooks and the proxy in sync (scripts/check-toml-sync.mjs).

client_id = "998fc0d45282e0a52c16dea36aaf686b"
application_url = "https://vendora-xxys.onrender.com"
embedded = true
name = "vendora"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_customers,write_draft_orders,read_inventory,read_orders,write_app_proxy"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/draft-orders"
  topics = [ "draft_orders/create", "draft_orders/update", "draft_orders/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/update", "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://vendora-xxys.onrender.com/api/auth" ]

[build]
# `shopify app dev` must never rewrite the production URLs.
automatically_update_urls_on_dev = false

# M3.5 Option 2: the theme's "Request a quote" block posts to /apps/vendora/quote-request.
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "vendora"
