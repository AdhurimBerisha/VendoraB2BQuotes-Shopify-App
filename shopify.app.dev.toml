# The "Vendora Dev" app for local development (`shopify app dev`, dev store abstore-hixo2jwg).
# Keep scopes, webhooks and the proxy in sync with shopify.app.toml (scripts/check-toml-sync.mjs).

client_id = "e32ebb2f0da0fcd81495a714e23f344a"
application_url = "https://example.com"
embedded = true
name = "Vendora Dev"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_customers,read_companies,write_draft_orders,read_inventory,read_orders,write_app_proxy,write_payment_terms"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/draft-orders"
  topics = [ "draft_orders/create", "draft_orders/update", "draft_orders/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/update", "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/update"
  topics = [ "shop/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
# `shopify app dev` sets the tunnel URLs on every run.
automatically_update_urls_on_dev = true

# M3.5 Option 2: the theme's "Request a quote" block posts to /apps/vendora/quote-request.
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "vendora"
